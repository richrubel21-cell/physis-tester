services:
  - type: web
    name: physis-tester
    runtime: image
    plan: standard
    region: oregon
    rootDir: backend
    dockerfilePath: ./Dockerfile
    dockerContext: .
    envVars:
      - key: ANTHROPIC_API_KEY
        sync: false
      - key: DATABASE_URL
        sync: false
      - key: FRONTEND_URL
        sync: false
      - key: PHYSIS_TEST_USER_TOKEN
        sync: false
      # Bearer token guarding /admin/cleanup-orphans. Fail-closed: when
      # unset, the endpoint refuses every request with 503 (set in the
      # Render dashboard to a long random string to enable manual
      # cleanup). The startup hook runs the same cleanup automatically
      # on every boot regardless of this token.
      - key: TESTER_ADMIN_TOKEN
        sync: false
