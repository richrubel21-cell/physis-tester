services:
  - type: web
    name: physis-tester
    runtime: python
    region: oregon
    # Standard required for Playwright + chromium (~400 MB on disk,
    # ~250-400 MB RAM per browser context). Free tier OOMs the worker
    # the moment chromium loads alongside FastAPI + SQLAlchemy.
    plan: standard
    # buildCommand drops --with-deps because Render's build env blocks
    # the su/root escalation that --with-deps needs to apt-install
    # chromium's system libs ("Switching to root user… Password: su:
    # Authentication failure"). Without --with-deps, playwright still
    # downloads the chromium binary into ~/.cache/ms-playwright; the
    # base Render image is expected to ship glibc + fontconfig +
    # libnss + libxkbcommon already, so chromium should launch.
    # If chromium ever fails to *launch* at runtime with a missing-
    # library error (e.g. "error while loading shared libraries:
    # libfoo.so.X"), we'll diagnose from that runtime error and either
    # bake the lib in via a custom Docker image or switch to a build
    # plan that allows root.
    buildCommand: pip install -r requirements.txt && playwright install chromium
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    rootDir: backend
    envVars:
      - key: ANTHROPIC_API_KEY
        sync: false
      - key: DATABASE_URL
        sync: false
      - key: FRONTEND_URL
        value: https://physis-tester.pages.dev
      # Optional: set to enable Tests 43 & 46 (marketplace functional
      # tests). Bearer token for a dedicated Supabase test user that
      # licenses real marketplace apps via POST /api/marketplace/license.
      # Leave unset to skip those tests with reason "no test user token".
      - key: PHYSIS_TEST_USER_TOKEN
        sync: false
