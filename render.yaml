services:
  - type: web
    name: physis-tester
    runtime: python
    region: oregon
    # Standard required for Playwright + chromium (~400 MB on disk,
    # ~250-400 MB RAM per browser context). Free tier OOMs the worker
    # the moment chromium loads alongside FastAPI + SQLAlchemy.
    plan: standard
    # buildCommand runs as root in Render's build env — `--with-deps`
    # apt-installs chromium's system libs (libnss3, libxkbcommon, etc.)
    # and downloads the chromium binary into ~/.cache/ms-playwright.
    # If this ever fails, fall back to:
    #   apt-get install -y libnss3 libnspr4 libdbus-1-3 libatk1.0-0
    #     libatk-bridge2.0-0 libcups2 libdrm2 libxkbcommon0 libxcomposite1
    #     libxdamage1 libxfixes3 libxrandr2 libgbm1 libpango-1.0-0
    #     libcairo2 libasound2
    #   playwright install chromium
    buildCommand: pip install -r requirements.txt && playwright install --with-deps chromium
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    rootDir: backend
    envVars:
      - key: ANTHROPIC_API_KEY
        sync: false
      - key: DATABASE_URL
        sync: false
      - key: FRONTEND_URL
        value: https://physis-tester.pages.dev
      # Optional: set to enable Tests 43 & 46 (marketplace functional
      # tests). Bearer token for a dedicated Supabase test user that
      # licenses real marketplace apps via POST /api/marketplace/license.
      # Leave unset to skip those tests with reason "no test user token".
      - key: PHYSIS_TEST_USER_TOKEN
        sync: false
