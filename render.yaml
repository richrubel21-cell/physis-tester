services:
  - type: web
    name: physis-tester
    runtime: image
    plan: standard
    region: oregon
    rootDir: backend
    dockerfilePath: ./Dockerfile
    dockerContext: .
    envVars:
      - key: ANTHROPIC_API_KEY
        sync: false
      - key: DATABASE_URL
        sync: false
      - key: FRONTEND_URL
        sync: false
      - key: PHYSIS_TEST_USER_TOKEN
        sync: false
